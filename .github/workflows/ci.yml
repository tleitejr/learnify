name: Learnify CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'learnify-api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'learnify-web/**'
              - '.github/workflows/ci.yml'

  api:
    name: Learnify API
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: learnify-api

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with Automatic Caching
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests and Generate Coverage Report
        run: ./gradlew test jacocoTestReport --no-daemon --stacktrace

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-test-report
          path: |
            learnify-api/build/reports/tests/test
            learnify-api/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-jacoco-report
          path: |
            learnify-api/build/reports/jacoco
            learnify-api/build/.coverage
          if-no-files-found: ignore
          retention-days: 7

  api-integration:
    name: Learnify API (Integration)
    needs: api
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: learnify-api

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with Automatic Caching
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Run Integration Tests and Verify Coverage
        run: ./gradlew integrationTest jacocoTestCoverageVerification --no-daemon --stacktrace

      - name: Upload Integration Test Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-integration-test-report
          path: |
            learnify-api/build/reports/tests/integrationTest
            learnify-api/build/test-results/integrationTest
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Learnify Web
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: learnify-web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: learnify-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Type-Check and Build
        run: npm run build

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage

      - name: Upload Vitest Coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-coverage
          path: learnify-web/coverage
          if-no-files-found: ignore
          retention-days: 7

  web-e2e:
    name: Learnify Web (E2E)
    needs: web
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: learnify-web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: learnify-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-playwright-report
          path: learnify-web/test-results
          if-no-files-found: ignore
          retention-days: 7
